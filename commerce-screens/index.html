<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="국내외 쇼핑몰·쇼핑몰 솔루션·법령을 조사해 정리한 모바일 커머스 화면 목록">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>모바일 커머스 화면 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 스펙 시트 — 왼쪽 영역 레일(모바일에선 가로 스트립) + 오른쪽 화면 ID 목록, 상단에 영역별 필요도 누적 막대 */
:root {
  --paper: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #121A26;
  --ink-2: #4B5668;
  --ink-3: #7A8496;
  --line: #DCE1EA;
  --accent: #2B47C9;
  --accent-soft: #E7ECFC;
  --legal: #B3262C; --legal-bg: #FBE8E9;
  --store: #7339B3; --store-bg: #F2E9FC;
  --mvp: #2B47C9; --mvp-bg: #E7ECFC;
  --rec: #19705F; --rec-bg: #E1F2EE;
  --opt: #687284; --opt-bg: #ECEFF3;
  --f-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131B; --surface: #151C27; --ink: #E5E9F0; --ink-2: #A3AEBF; --ink-3: #7C879A; --line: #263042;
    --accent: #8299FF; --accent-soft: #1D2643;
    --legal: #FF8E93; --legal-bg: #3A1D22; --store: #CDA6F6; --store-bg: #2B2140;
    --mvp: #8299FF; --mvp-bg: #1D2643; --rec: #72D5C1; --rec-bg: #14302B; --opt: #A6AFBD; --opt-bg: #222A36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131B; --surface: #151C27; --ink: #E5E9F0; --ink-2: #A3AEBF; --ink-3: #7C879A; --line: #263042;
  --accent: #8299FF; --accent-soft: #1D2643;
  --legal: #FF8E93; --legal-bg: #3A1D22; --store: #CDA6F6; --store-bg: #2B2140;
  --mvp: #8299FF; --mvp-bg: #1D2643; --rec: #72D5C1; --rec-bg: #14302B; --opt: #A6AFBD; --opt-bg: #222A36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; padding-inline: 20px; padding-block: 0 64px; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin-inline: auto; }
.mast { padding-block: 40px 24px; display: grid; gap: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; text-wrap: balance; }
.lede { max-width: 68ch; color: var(--ink-2); margin: 0; font-size: 16px; }
.tldr { display: grid; gap: 6px; max-width: 80ch; margin: 4px 0 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tldr p { margin: 0; }
.tldr b { font-weight: 600; }
.memo { display: grid; gap: 8px; max-width: 980px; }
.memo h2 { font-size: 18px; }
.memo p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 75ch; }
.memo-scroll { overflow-x: auto; }
.memo table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.memo th, .memo td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.memo th { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.memo td.lv1 { font-weight: 600; white-space: nowrap; }
.memo td.lv2 { padding-left: 28px; white-space: nowrap; color: var(--ink-2); }
.memo a.idl { font-family: var(--f-mono); font-size: 12px; font-weight: 600; text-decoration: none; padding: 1px 6px; margin: 0 4px 4px 0; border-radius: 4px; background: var(--accent-soft); display: inline-block; }
.memo .gap { color: var(--legal); font-weight: 600; }
.overview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 18px; border-top: 1px solid var(--line); }
.ov-head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: baseline; justify-content: space-between; }
.ov-head h2 { font-size: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 40px; gap: 12px; align-items: center; font-size: 13px; background: none; border: 0; padding: 2px 0; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
.bar-row:hover .bar-label { color: var(--accent); }
.bar-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-label code { font-family: var(--f-mono); color: var(--ink-3); margin-right: 6px; }
.bar-track { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar-track span { display: block; height: 100%; }
.bar-n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.seg-legal { background: var(--legal); } .seg-store { background: var(--store); } .seg-mvp { background: var(--mvp); } .seg-rec { background: var(--rec); } .seg-opt { background: var(--opt); }

.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; display: flex; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }
.chip[aria-pressed="true"].n-legal { color: var(--legal); background: var(--legal-bg); }
.chip[aria-pressed="true"].n-store { color: var(--store); background: var(--store-bg); }
.chip[aria-pressed="true"].n-mvp { color: var(--mvp); background: var(--mvp-bg); }
.chip[aria-pressed="true"].n-rec { color: var(--rec); background: var(--rec-bg); }
.chip[aria-pressed="true"].n-opt { color: var(--opt); background: var(--opt-bg); }
.chip:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.btn { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.toast { font-size: 13px; color: var(--rec); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; padding-top: 20px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; display: grid; gap: 2px; font-size: 14px; }
.rail a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; }
.rail a:hover { background: var(--accent-soft); color: var(--ink); }
.rail a code { font-family: var(--f-mono); color: var(--ink-3); }
.rail a .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rail a.empty { opacity: .45; }

.cat { display: grid; gap: 8px; padding-bottom: 28px; scroll-margin-top: 90px; }
.cat-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.cat-head code { font-family: var(--f-mono); font-weight: 600; font-size: 15px; color: var(--accent); }
.cat-head .sub { font-size: 13px; color: var(--ink-3); flex-basis: 100%; }
.rows { display: grid; }
.row { border-bottom: 1px solid var(--line); }
.row > summary { list-style: none; display: grid; grid-template-columns: 58px minmax(140px, 1.1fr) minmax(0, 1.6fr) 118px 92px; gap: 12px; align-items: baseline; padding: 10px 6px; cursor: pointer; }
.row > summary::-webkit-details-marker { display: none; }
.row > summary:hover { background: var(--surface); }
.row > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row[open] > summary { background: var(--surface); }
.id { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nm { min-width: 0; }
.nm b { font-weight: 600; }
.nm .added { font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em; color: var(--accent); margin-left: 6px; vertical-align: 1px; }
.pp { color: var(--ink-2); font-size: 14px; min-width: 0; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; justify-self: start; white-space: nowrap; }
.n-legal.badge { color: var(--legal); background: var(--legal-bg); }
.n-store.badge { color: var(--store); background: var(--store-bg); }
.n-mvp.badge { color: var(--mvp); background: var(--mvp-bg); }
.n-rec.badge { color: var(--rec); background: var(--rec-bg); }
.n-opt.badge { color: var(--opt); background: var(--opt-bg); }
.kd { font-size: 12px; color: var(--ink-3); }
.cond { font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em; color: var(--legal); margin-left: 6px; vertical-align: 1px; }
.criteria { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 18px; font-size: 13px; color: var(--ink-2); margin: 0; padding: 0; list-style: none; }
.criteria li { min-width: 0; }
.criteria b { font-weight: 600; }
.criteria b.n-legal { color: var(--legal); } .criteria b.n-store { color: var(--store); } .criteria b.n-mvp { color: var(--mvp); } .criteria b.n-rec { color: var(--rec); } .criteria b.n-opt { color: var(--opt); }
.more { padding: 4px 6px 16px 76px; background: var(--surface); }
.more dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.more dt { color: var(--ink-3); font-size: 13px; }
.more dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mall { display: inline-block; font-size: 12px; padding: 1px 7px; margin: 0 4px 4px 0; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }
.empty-state { padding: 40px 0; color: var(--ink-2); }

.appx { display: grid; gap: 14px; padding-top: 28px; margin-top: 12px; border-top: 1px solid var(--line); }
.appx details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.appx summary { cursor: pointer; font-weight: 600; }
.appx ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.appx h3 { font-size: 14px; margin: 14px 0 0; color: var(--ink-2); }
.appx li { overflow-wrap: anywhere; }
.method { font-size: 14px; color: var(--ink-2); max-width: 80ch; }
.method table { border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.method td, .method th { border-bottom: 1px solid var(--line); padding: 4px 12px 4px 0; text-align: left; font-variant-numeric: tabular-nums; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .rail a { display: flex; white-space: nowrap; }
  .row > summary { grid-template-columns: 50px minmax(0, 1fr) auto; grid-template-areas: "id nm badge" ". pp pp"; gap: 2px 10px; }
  .row > summary .id { grid-area: id; } .row > summary .nm { grid-area: nm; } .row > summary .badge { grid-area: badge; } .row > summary .pp { grid-area: pp; }
  .row > summary .kd { display: none; }
  .more { padding-left: 16px; }
  .more dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .more dd { margin-bottom: 8px; }
  .bar-row { grid-template-columns: 112px minmax(0, 1fr) 34px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="eyebrow">화면 인벤토리 · 2026-10-17 조사</p>
    <h1>모바일 커머스 화면 목록</h1>
    <p class="lede" id="lede"></p>
    <div class="tldr" id="tldr"></div>
  </header>

  <section class="memo" id="memo" hidden></section>

  <section class="overview" aria-labelledby="ov-title">
    <div class="ov-head">
      <h2 id="ov-title">영역별 화면 수</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="bars" id="bars"></div>
    <ul class="criteria">
      <li><b class="n-legal">법적필수</b> 국내 법령·고시가 화면이나 그 안의 고지·동의를 요구합니다. 조건부는 그 조건일 때만 의무입니다.</li>
      <li><b class="n-store">스토어정책필수</b> Apple·Google 심사 기준이 요구합니다.</li>
      <li><b class="n-mvp">핵심(MVP)</b> 없으면 가입부터 구매·배송·클레임 흐름이 끊깁니다.</li>
      <li><b class="n-rec">권장</b> 대부분 몰에 있지만 1차 오픈에 없어도 운영할 수 있습니다.</li>
      <li><b class="n-opt">선택·차별화</b> 일부 몰의 차별화 기능이거나 특정 업종용입니다.</li>
    </ul>
  </section>

  <div class="toolbar" role="search">
    <label class="search" for="q"><input id="q" type="search" placeholder="화면명·요소·몰 이름 검색 (예: 반품, 쿠팡, 바텀시트)" autocomplete="off"></label>
    <div class="chips" id="needChips" aria-label="필요도 필터"></div>
    <label for="kind" class="count">종류</label>
    <select id="kind"></select>
    <span class="count" id="count"></span>
    <button class="btn" id="copy" type="button">표로 복사</button>
    <span class="toast" id="toast" role="status"></span>
  </div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="영역 이동"></nav>
    <main id="list"></main>
  </div>

  <section class="appx" id="appx"></section>

다", "쿠팡 주문취소 화면은 결제수단별 환불 소요일(가상계좌·카드·휴대폰·쿠페이머니·캐시)을 안내하고, 배송이 시작되면 취소 대신 반품으로 넘긴다", "쿠페이 결제 비밀번호를 재설정할 때는 휴대폰·통신사 선택 후 ARS 인증을 거친다. '비밀번호 없이 결제' 설정 옵션도 있다", "11번가 슈팅배송(슈팅셀러) 상품은 배송 완료 후 24시간 안에 사진을 첨부해야 반품·교환을 접수할 수 있다. 반품 신청 화면에 상품 유형별 사진 필수 규칙이 들어간다", "11번가 AI 검색(2026-08)은 상품군을 입력하면 세부 키워드 칩을 제안하고, 재검색 없이 5개 안팎을 추천한다. 모바일 앱 전용이다. 그 전에는 빠른배송·최저가·후기 기준의 멀티탭 검색을 썼다", "11번가·SSG 선물하기에서는 받는 사람이 문자·카카오톡 링크에서 직접 배송지를 넣는다(회원가입 불필요). SSG는 연락처만으로 최대 200명에게 보낼 수 있다", "G마켓 홈에는 앱을 열자마자 택배 위치와 문의 답변 여부가 상태 카드로 나온다. My G에서는 오늘 도착 예정 상품을 모아 보여준다", "G마켓은 하단 스마일 버튼으로 들어가는 멤버십 전용 홈에서 클럽 전용 특가와 캐시백 e쿠폰을 판다", "G마켓 꼭 멤버십(2026-04, 월 2,900원)에는 적립액이 이용료보다 적으면 차액을 채워 주는 캐시보장제가 있다. 쓱7클럽과 연동하려면 개인정보 제3자 제공 동의가 필요하다", "G마켓 무료반품(2026-08)은 꼭 회원의 스타배송 상품에만 적용된다. 월 3회, 배송 완료 7일 이내 조건이라 잔여 횟수 표시가 필요하다", "G마켓 iOS 앱은 최근 버전 업데이트가 거의 다 스크린리더 접근성 개선이다. 국내 대형몰은 접근성을 출시 품질 기준으로 다룬다", "SSG는 배송 유형이 주간·새벽·트레이더스·바로퀵(1시간)·2시간·스타배송으로 나뉜다. 날짜(3일 뒤까지)와 시간대를 고르는 예약 배송 화면이 핵심이다. 대상 지역이면 메인과 주문서에 '2시간 내 배송 가능' 메시지가 자동으로 나온다", "SSG는 생체인증으로 로그인과 원클릭 결제 비밀번호를 대신한다. 이미지 검색, 위치 기반 주변 호텔 검색, 상품권 PIN으로 SSG MONEY 충전도 있다", "쿠팡 앱은 영어 버전을 지원한다(언어 설정 화면)", "쿠팡·G마켓·SSG 모두 앱스토어 설명에 정보통신망법 제22조의2 근거의 필수/선택 접근권한 고지문을 싣는다. G마켓은 필수 권한이 없다", "제약: help.coupang.com은 DNS 실패로 열리지 않았다. 11번가 App Store 페이지는 404였고, Play 스토어(G마켓·11번가·옥션)는 본문이 잘렸다. 그래서 쿠팡·11번가 세부 흐름 상당수는 공식 도움말 대신 이용 가이드 블로그와 상품 상세 원문으로 확인했다", "전자상거래법 2024년 개정(다크패턴·정기결제) 조항 번호는 fetch하지 않고 기억에 의존했다. 병합 단계에서 법령 원문으로 다시 확인해야 한다"]}, {"rid": "kr-vertical", "findings": ["지그재그: 주문 상세에서 결제 직후 옵션(사이즈·컬러)을 바꾸는 '주문 후 옵션 변경' 화면과 출고 전 '주문 후 배송지 변경' 화면이 있음", "지그재그: 배송지를 2개 이상 가진 고객이 빠른배송 주문 시 결제 직전 '배송지 한 번 더 확인' 팝업을 띄움(오배송 방지 패턴)", "지그재그: 상품 '찜'과 스토어 '즐겨찾기'를 분리 운영하고, 공유 성과 보상(공유리워드)과 정산 정보 등록 화면이 있음", "29CM: 선물 수신자가 '내 선물함 > 받은 선물'에서 직접 교환·반품을 신청하고, 발신자에게는 안내 문구만 노출(2026-07)", "29CM: PT·브랜드 코멘터리·이구홈터뷰·이구 디자인 뮤지엄 같은 장문 브랜드 스토리 콘텐츠가 탐색의 핵심 축이며, 업데이트로 옵션별 리뷰 필터를 추가함", "29CM: 이구위크·이구홈위크·이구패션위크처럼 시즌 대형 기획전을 앱 업데이트 노트에 명시할 정도로 기획전 랜딩이 중요", "무신사: 후기를 일반·포토·스타일·사이즈 4종으로 나누고 체형(키·몸무게)·체감 데이터를 사이즈 추 플), 국가 동물등록 신청, 리콜 이력·평점 기준 판매 배지 같은 국내에서만 보이는 화면을 둠", "어바웃펫은 커머스 앱 안에 펫TV(훈련 영상)와 펫로그(SNS)를 넣은 콘텐츠형 펫몰임. 정기배송은 검토했지만 고객이 필요할 때 사는 성향이 강하다고 보고 보류함(2025-04 보도)", "Petco와 PetSmart 앱은 오프라인 서비스(미용·호텔·데이케어) 예약, 매장 픽업·커브사이드, 매장 재고 확인, 온·오프라인 통합 구매이력, 유료 멤버십(Vital Care) 리워드 로드가 핵심 화면임", "Chewy CarePlus 보험은 자체 화면에서 소개만 하고, 청구·보장 확인은 보험사(Lemonade) 앱으로 넘김. 펫 보험은 외부 웹뷰·앱 연계형이 일반적임", "급여량 계산기는 펫몰 본체보다 펫푸드 전문앱(샐러드펫·포옹)과 제조사(로얄캐닌)에서 확인됨. 정기배송 주기 제안과 묶으면 차별화할 수 있음(추론)", "정기배송(자동결제)은 2025-02-14 시행된 전자상거래법 다크패턴 규제(숨은 갱신·해지 방해 금지)를 받으므로 자동결제 동의 화면과 쉬운 해지 화면이 필요함. 조항 원문은 이번 조사에서 확인하지 못함"]}, {"rid": "global-big", "findings": ["Amazon의 쇼핑 AI Rufus가 2026-05-13 「Alexa for Shopping」으로 이름이 바뀌었다. 단일 채팅 화면이 아니라 홈·상품상세·카메라(Lens Live) 화면 곳곳에 진입점이 있는 오버레이형이다.", "가격 이력(30·90일)·목표가 알림·목표가 자동 구매(구매 후 24시간 무료 취소, 요청 6개월 유지)가 AI 어시스턴트 기능으로 들어갔다(Amazon).", "손글씨 장보기 목록을 촬영하면 품목을 인식해 장바구니에 한꺼번에 담는 화면이 있다(Amazon, iOS 먼저).", "Lens Live: 카메라를 비추기만 해도 물체를 자동 인식해 하단 캐러셀에 유사 상품을 띄우고, 카메라 화면을 떠나지 않고 장바구니·위시리스트에 담는다. 2025-09 출시, 미국 iOS 한정.", "외부 브랜드 사이트 상품을 대신 사 주는 'Buy for Me'와, 브랜드 사이트로 보내는 'Shop Direct' 진입이 있다(Amazon).", "무포장·무라벨 QR 반품이 있다: 앱에서 드롭오프 지점(Whole Foods·UPS Store·Kohl's 등)을 고르면 QR이 발급되고, 지점 직원이 포장해 발송한다(Amazon).", "배송 당일 기사 위치 지도 추적과 추적 링크 공유(Share Tracking)를 제공한다(Amazon).", "Amazon Day: 유료 회원이 여러 주문을 원하는 요일 하루에 몰아 받도록 지정한다. Subscribe & Save·대형·3자 판매 상품은 제외된다.", "Amazon Household가 Amazon Family로 바뀌는 중이다. 같은 주소, 결제수단 상호 공유 동의가 조건이며, 가구 밖으로의 Prime 배송 공유는 종료됐다.", "Walmart는 주문서에서 품목마다 대체 허용 여부를 정하고, 쇼퍼가 제안한 대체상품을 승인·거절하며, 쇼퍼와 사진 채팅을 한다.", "Walmart·Target은 픽업·배달 시간대 예약, 익스프레스(최소 1시간) 옵션, 매장 선택이 가격·재고·슬롯의 기준이 된다.", "Target Drive Up의 도착 흐름은 '출발했어요' → '도착했어요' → 주차 칸 번호 입력 순서다. 픽업을 드라이브업으로 바꾸는 것은 앱에서만 된다. 늦은 '더블탭' 체크인은 매장 운영 문제로 보도됐다.", "Target Drive Up에는 Starbucks 음료 애드온, 차에서 반품하기, Apple CarPlay 진입이 있다.", "Target Shopping Partner: 주문서에서 대리 수령인의 이름·이메일을 등록한다. 수령인은 이메일 확인과 앱 설치 절차를 거친다.", "Target Wallet 바코드 하나로 매장 계산대에서 회원 딜·기프트카드·제휴카드 5% 할인이 자동으로 합산된다. Walmart는 Walmart Pay와 Scan & Go(셀프 스캔 결제)로 매장 결제 화면을 앱 안에 둔다.", "Target Circle은 활동 완료형 보너스 미션(예: 당일배송 2회 시 리워드), 저장해야 쓰는 딜, 유료 회원 24시간 선공개 세일, 학생·교사 멤버십 50% 할인 인증을 운영한다.", "Walmart+ 해지 흐름 중간에 15일 연장·연간 전환 같은 리텐션 제안이 끼어든다. 무료체험 해지는 즉시 종료, 유료 해지는 기간 만료까지 유지다. 국내 적용 시 2025-02 시행 전자상거래법 다크패턴 규정을 검토해야 한다(조항 번호는 법무 확인 필요).", "커머스 밖 기능이 편입돼 있다: Walmart 앱은 약국(처방 리필·이관·예약)과 주유 할인, Amazon 앱은 Apple Health→One Medical 연동.", "막힌 출처: amazon.com 도움말(503), walmart.com 도움말(봇 확인), Page Flows(유료). 그래서 앱스토어 설명, 뉴스룸, 3자 가이드로 우회했다. Amazon Your Account 메뉴 세부, Amazon Pay, 기프트카드 구매, Amazon Live, 레지스트리는 근거를 확보하지 못해 '일반 관행'으로 표시했다."]}, {"rid": "global-crossborder", "findings": ["Temu는 주문 목록·주문 상세에 '가격 조정' 버튼을 둔다(30일 안에 같은 상품 가격이 내리면 차액 신청). 차액은 현금(최대 30일) 또는 크레딧(수 분) 중 골라 받는다. 근거는 3자 출처이고 공식 문서는 확인하지 못했다.", "지연 배송 보상: Temu는 예상 도착일을 넘기면 크레딧을, AliExpress(미국)는 1달러 쿠폰을 준다. 그래서 '보상 수령 모달 + 월렛·크레딧 내역' 화면이 필요하다.", "AliExpress 분쟁 흐름: 판매자는 5일 안에 응답해야 하고, 부분환불·재발송을 제안할 수 있으며, 기한 안에 고르지 않으면 플랫폼 결정이 적용된다. 반품과는 별개의 다단계 화면이다.", "2026-07-01부터 EU가 150유로 미만 소포에 3유로 관세를 매긴다. AliExpress는 상품에 '관세·VAT 포함' 표기를 하고, 결제 전에 수입 비용 내역을 보여준다고 밝혔다. 크로스보더 몰은 상품 상세·주문서 모두에 관세 표시 화면이 필요하다.", "한국향 해외직구는 배송지에 개인통관고유부호 입력·검증 화면이 사실상 필요하다(이번 조사에서 직접 확인한 출처는 없어 일반 관행으로 표기).", "AliExpress Coins 탭에는 출석(1→16코인, 끊기면 초기화), Merge Boss(하루 최대 25코인), GoGo Match, 꽃 물주기가 있다. 코인은 0.01+코인 상품으로 교환하며 6개월 뒤 만료된다.", "Temu의 Fishland·Farmland(육성형), Hat Trick(카드 매칭), Free Gifts가 있다. Free Gifts는 친구 가입·구매로 남은 금액을 줄여 무료로 받는 방식이고 24시간 같은 마감 타이머가 붙는다. 초대 화면과 진행 현황 화면이 핵심이다.", "Shein 무료 체험 센터: 주 3개까지 신청 → My Applications에서 대기·승인·탈락 확인 → 수령 후 10일 안에 리포트를 내야 하며, 늦으면 자격이 제한된다.", "Shein은 출석·포토리뷰·라이브 시청·아웃핏 챌린지·이메일 인증·배송 확인으로 포인트를 준다(100포인트=1달러, 주문당 최대 70% 사용). S0~S3 등급과 유료 SHEIN Club도 있다.", "사이즈 추천 3사 비교: ASOS Fit Assistant는 키·몸무게·핏 선호 3문항, Shein Check My Size는 체형·브라 사이즈까지 입력, Zalando는 '작게·크게 나옴' 플래그와 사진 2장 신체 측정(측정 후 사진 삭제)을 쓴다. 사이즈 조언이 붙은 상품은 사이즈 때문인 반품이 약 10% 적었다.", "Zalando 앱에는 지난 주문 핏 평가, 가상 피팅룸, AI 어시스턴트, Trend Spotter(도시별 트렌드), 크리에이터 보드, 프리러브드관이 있다. 위시리스트는 사이즈 변동·가격 인하·재입고를 알려준다.", "Zalando·Shein은 반품 라벨 대신 QR 코드를 발급하고, 우체국·파슬샵에서 스캔하면 라벨이 출력된다. 그래서 'QR 화면 + 드롭오프 지점 안내'가 필요하다.", "ASOS 공정 이용 정책: 반품률이 70%를 넘으면 Premier 구매·갱신이 막히고 소포당 반품비 £3.95를 차감한다. 이를 알리는 반품 제한 상태 화면이 필요하다.", "ASOS 재입고 알림은 찜 목록의 Notify Me로 신청하며 앱 전용이고 1회성이다(다시 품절되면 재신청). Style Match는 검색창 카메라 아이콘으로 쓰며 이미지를 저장하지 않는다.", "Etsy 샵 홈에는 Request Custom Order 버튼이 있다. 메시지함에는 Custom Requests 폴더가 따로 있고, 요청에는 '필요 날짜'와 참고 이미지를 첨부한다.", "Etsy Gift Mode는 받는 사람·상황 질문으로 약 200개 페르소나 중 하나로 분류해 선물 가이드를 만든다. 받는 사람에게는 메시지·배송 조회·선물 힌트를 담은 미리보기 페이지를 보낼 수 있다.", "Etsy 찜은 컬렉션(폴더)·샵 팔로우·검색어 저장으로 나뉜다. Deals 피드는 찜한 샵의 세일과 찜 상품의 가격 인하를 모아 보여준다.", "Zalando Lounge는 장바구니를 20분만 유지하고, Plus 회원은 조기 구매(Early Access)와 재입고·세일 우선 알림을 받는다.", "Zalando Pre-owned 매입: 사진·브랜드·사이즈를 입력하면 견적이 나오고, 기프트카드 또는 기부로 받는다. 구매 이력이 자동으로 채워지는 '내 옷장'과 연결된다(2020~21 자료라 현재 운영 여부는 미확인).", "막힌 출처: help.etsy.com(WebFetch 403), mobbin.com(403), m.shein.com 도움말(본문 잘림), asos.com(타임아웃), Temu 공식 support-center 문서(검색 미노출), Baymard Shein 감사(유료). 게임·체험단 화면은 대부분 3자 블로그·포럼 근거다."]}, {"rid": "solution-templates", "findings": ["Cafe24 모바일 모듈은 국내 법적 고지·동의를 개별 팝업으로 나눈다: 청약철회방침, 배송정보 제3자 제공, 전자보증보험 발급, 비회원 개인정보 수집, 이용약관·개인정보 수집·제3자 제공·처리 위탁 전문 보기, 14세 미만 구매제한.", "Cafe24는 장바구니를 국내 배송상품과 해외 배송상품으로 나눠 두 화면으로 제공한다.", "Cafe24 인트로 게이트는 본인인증형·회원인증형·성인인증형(법적권고)이 있어 폐쇄몰과 성인몰을 지원한다.", "Cafe24에는 예치금(잔액·상세), 미가용 적립금, 미가용 쿠폰처럼 국내 솔루션 특유의 혜택 원장 화면이 있다.", "Cafe24 게시판은 유형이 다양하다: 운영일지, 한 줄 메모, 캘린더, 긴급문의(상품·주문 검색 포함), 출석체크(달력형·댓글형), 견적서, 공급사 미니샵.", "Cafe24 로그인 화면은 '로그인 전체 화면형 / 비회원 주문 조회' 하나의 모듈로 묶여 있다. 비회원 주문조회를 로그인 화면의 탭으로 두는 것이 국내 표준이다.", "고도몰5 디자인 에디터는 페이지를 셋으로 나눈다: MVP 8페이지(메인·상품 목록·상품 상세·검색결과·장바구니·주문서·회원가입·로그인), 운영자가 추가하는 빈 페이지(기획전·이벤트), 에디터로 고칠 수 없는 비MVP 시스템 페이지(게시판·1:1 문의·마이페이지).", "Shopify의 레거시 고객 템플릿(login·register·account·order·addresses·reset_password·activate_account)은 폐지 예정이다. 대체 계정은 이메일 6자리 일회용 코드로 비밀번호 없이 로그인하고, 주문 목록에서 다시 구매·반품 시작·리뷰 남기기를 바로 실행한다.", "Shopify에는 국내 스킨에 없는 템플릿이 있다: password(오픈 전 비밀번호 보호 랜딩), gift_card(발급된 기프트카드 표시), metaobject(브랜드·작가 같은 구조화 콘텐츠 페이지), blog·article(매거진).", "WooCommerce에는 order-pay(미결제 주문 결제 링크), 결제수단 기본 지정·삭제 엔드포인트, downloads(디지털 상품 다운로드)가 있다. 환불·반품 정책 페이지는 기본 초안으로 생성된다.", "Baymard 모바일 벤치마크는 체크아웃을 배송지·청구지·배송방법·결제·주문검토·영수증 단계로 나눈다. 국내 몰이 흔히 쓰는 원페이지 주문서와 대비된다.", "아임웹은 주문 목록과 주문 상세를 분리하고, 구매 고객의 마이페이지에서 판매자가 추가 결제를 요청하는 화면 흐름을 둔다.", "배송 조회는 솔루션 스킨 목록에는 독립 화면으로 거의 나오지 않는다(택배사 외부 링크에 의존). 반면 앱 UI 키트(Himmel.co, QuickShop, Ecommerz)에는 독립 화면으로 들어 있다.", "조사 한계: 메이크샵과 식스샵의 모바일 페이지 목록, Cafe24 스킨 파일 경로, UI8 공식 화면 목록, Baymard 모바일 계정·주문추적 페이지 유형은 공개 자료로 확인하지 못했다. Baymard 쪽은 Premium 전용이다.", "법 조항 근거(전자상거래법 제7·10·13·17·24조, 개인정보보호법 제15·17·22조의2·30조, 정보통신망법 제22조의2·42조의3·50조, 청소년보호법 제16조)와 App Store 5.1.1(v)는 일반 지식으로 붙였고 이번 조사에서 원문을 다시 확인하지 않았다. 최종 보고서에는 법무 검토가 필요하다고 표시해야 한다."]}, {"rid": "legal-policy", "findings": ["전자상거래법 시행령 제27조의3(2026-07-21 시행): 리뷰 첫 화면에 작성 권한자·게시기간·평점 기준·삭제 기준·이의제기 절차를 공개해야 함(계도 3개월). 리뷰 목록에 '운영정보' 영역이 법정 요소가 됨", "공정위 「다크패턴 방지를 위한 온라인 인터페이스 운영 가이드라인」(2026-10-06): 13개 유형으로 통합. 취소·탈퇴 버튼은 로그인 첫 화면이나 1클릭 거리(마이페이지)에 두고 가입과 같은 방식으로 해지, 반복 팝업은 '7일간 보지 않기' 권장", "정기결제 증액·무료→유료 전환은 결제 30일 이내 별도 동의와 거부 버튼이 필요하고 가입 때 일괄 동의로 대신할 수 없음 → '정기결제 변경 동의' 전용 화면이 필요(제13조 ⑥)", "총액 표시 규제(제21조의2 순차공개 가격 금지)로 상품 리스트·상세 첫 화면에 배송비·설치비 포함 총액 표기가 필요. 네이버쇼핑은 계도기간 종료 후 표기를 강화함", "단위가격 표시: 2026-04-07부터 연 거래액 10조 이상 온라인몰(쿠팡·네이버플러스스토어)에 114개 품목 의무. 그 밖의 몰은 권장 수준", "당근마켓은 첫 화면에 '중개자=거래 당사자 아님'을 고지하지 않아 제재받음 → 홈 하단 사업자정보 영역에 중개자 고지 문구가 필수", "유효기간제(휴면 분리보관)는 2023-09-15 폐지(크몽·인프런은 휴면 제도 없앰) → 휴면 해제 화면은 이제 법적 필수가 아니고 자율 정책", "2024 개인정보위 지침: 배송용 이름·연락처·주소처럼 계약이행에 필요한 정보는 '필수동의'가 아닌 '고지'로 바꾸고, 마케팅을 필수동의에 묶으면 처분 대상(2025-05 처분 사례)", "정보통신망법 제50조: 야간(21~08시) 광고 별도 동의 토글, 수신동의·철회 처리결과 14일 내 통지, 2년마다 재확인이 필요해 설정·알림 화면에 법정 요소가 추가됨", "Google Play는 앱 내 계정 삭제와 별도로 '웹 계정 삭제 요청 페이지'(Data safety 양식에 URL 등록)를 요구 → 앱 밖 웹 화면 1개 추가", "Apple ATT 사전 안내 화면은 '계속' 단일 버튼만 허용하고 '허용' 문구·시스템 팝업 모방·보상을 금지함", "장애인차별금지법상 모바일앱은 접근성 준수 여부와 수어·문자·음성 대체 소통 채널을 제공해야 함(민간은 규모별 순차 적용, 적용 시기는 미확인)", "자체상품/중개상품 구분 표시 의무는 2026-06-17 발의 단계(미통과). 2027-01-21부터는 대형 해외사업자의 국내대리인 정보를 첫 화면에 공개해야 함", "막힌 출처: law.go.kr 원문·imweb 블로그(403)·brunch(장애). 조문은 nepla.ai 사본으로 확인함. 전자금융거래법 거래내역·오류정정·선불 환급 조문 번호와 다크패턴 과태료 부과 개시일은 원문으로 확인하지 못함"]}, {"rid": "payment-postpurchase", "findings": ["자체 페이는 독립 화면 묶음이 따로 필요하다: 가입·약관 → 카드/계좌 등록 → 6자리 비밀번호 → 생체·원터치 → 변경·ARS 초기화 → 머니 충전·인출 → 해지 (쿠팡·무신사·카카오페이)", "쿠팡 결제 비밀번호 초기화는 SMS가 아니라 ARS다. 통신사·번호 선택 후 전화로 생년월일 6자리를 입력하므로 'ARS 대기' 상태화면이 필요하다", "쿠팡은 비밀번호 없이 결제하는 '원터치결제'를 켤 때 타인 결제 위험 경고 모달을 띄운다", "토스페이먼츠 결제위젯은 재방문 구매자에게 직전 결제수단을 기본 선택하고, successUrl에서 금액을 검증한 뒤 승인한다(10분 내). 그래서 '승인 처리 중' 화면과 '세션 만료' 화면이 별도로 필요하다", "상점 페이지는 실패인데 SDK가 successUrl로 보낸 사례, 카카오페이 PC 결제 후 화면이 돌아오지 않은 사례가 있다. 그래서 '앱 전환 복귀·결과 재조회' 상태화면이 실무상 필수다", "가상계좌는 입금 전 취소면 환불계좌가 필요 없지만, 입금 후에는 예금주가 입금자와 같은 환불계좌를 받아야 한다. 같은 취소 플로우가 결제 상태에 따라 갈라진다", "쿠팡 선물하기는 결제 후 카카오톡에서 받는 사람을 지정한다. 받는 사람이 7일 안에 배송지를 넣지 않으면 자동 거절·취소되고(기프트카드형은 93일), 미수락 상태에서는 보낸 사람이 직접 취소할 수 있다", "쿠팡 반품은 '해결 방법 선택' 단계를 따로 두고, 회수 요청사항(문앞·경비실)과 환불 금액을 확인 화면에서 함께 보여준다. 로켓배송은 회수 전에 환불하는 선환불이다", "쿠팡 배송완료 사진(배달 완료 인증 사진)은 기사가 앱으로 찍어 수령인에게 보낸다. 미수령 신고 동선과 묶이는 차별화 화면이다", "쿠팡 '영수증 보기'(PDF)는 배송완료 주문에만 활성화되고 종이 영수증은 없다", "11번가는 배송완료 8일차에 자동으로 구매확정한다. 확정 뒤 반품 거부 민원이 있어 확정 경고 모달과 자동확정 예정일 표시가 필요하다", "쿠팡 정기배송 관리에는 '빨리 받고 다음 달로 건너뛰기'라는 복합 옵션이 있다. 쿠팡 정기배송은 2026년 신규 신청을 중단했고 종료가 보도됐다(아이뉴스24 보도 기준 '다음 달 29일'로, 정확한 종료일은 기사 날짜를 다시 확인해야 함). 첫 결제 뒤 가격이 바뀌면 바뀐 금액으로 결제돼 '고무줄 가격' 논란이 있었다", "전자상거래 소매업은 2021년부터 현금영수증 의무발행업종이다. 10만원 이상 현금결제는 요청이 없어도 발급해야 하므로 현금영수증 입력과 자진발급 안내 UI가 필요하다", "미확인·근거 약함: SSG페이 등록·지문 결제, KG이니시스·나이스페이 무이자할부 표시 방식, 네이버페이 구매자 구매확정·반품 화면은 공식 문서를 확보하지 못했다. G마켓 스타배송 도착보장·무료반품은 검색 요약으로만 확인했다"]}, {"rid": "app-system-engagement", "findings": ["강제 업데이트(최소 버전 차단)는 1.0부터 넣어야 한다. 구버전 앱에는 나중에 추가할 수 없어서 MVP 필수로 분류했다.", "토스(앱인토스)는 점검 화면에서 '점검 종료 알림 받기' 동의를 받고, 점검이 끝나면 푸시를 자동으로 보낸다. 대형 행사 장애 때 이탈을 막는 데 쓸 수 있다.", "컬리는 필수 접근권한 없이 선택 권한(알림·사진·카메라)만 고지하고, 허용하지 않아도 이용할 수 있다고 안내한다(정보통신망법 제22조의2 모범 사례).", "쿠팡은 2025년 12월 방미통위 사실조사 뒤 모바일 탈퇴를 허용하고 필수 주관식 설문을 없앴다(6단계→4단계). 와우 멤버십 해지도 2단계로 줄였다. 따라서 탈퇴·해지 화면은 짧게, 사유 입력은 선택으로 설계해야 한다(전자상거래법 다크패턴 규제).", "Google Play는 앱 내 탈퇴와 별도로 '웹 계정 삭제 요청 페이지'를 요구한다. 앱을 지운 사용자를 위한 것으로, iOS만 보고 설계하면 빠지기 쉽다.", "2023년 개인정보 유효기간제가 폐지되어 휴면 계정 해제 화면은 법적 의무가 아니다. 크몽 등은 휴면 조항을 삭제했으므로 선택 화면으로 분류했다.", "광고성 정보 수신은 처리결과 통지(제50조 제7항), 2년 주기 확인(제8항), 야간 21~08시 별도 동의가 필요하다. 그래서 설정에 수신 동의 관리, 처리결과 모달, 정기 확인 안내가 세트로 들어간다. '혜택 알림 동의' 같은 문구나 미리 체크된 박스는 무효가 될 수 있다.", "Apple 4.5.4에 따라 마케팅 푸시는 OS 알림 권한과 별개로 앱 UI에서 명시적 옵트인을 받아야 하고, 앱 안에 옵트아웃 경로도 있어야 한다.", "Apple 5.6.1은 커스텀 리뷰 프롬프트를 금지한다. '앱이 마음에 드세요?'처럼 리뷰를 걸러내는 사전 질문 화면은 피하고, 불만은 설정의 '의견 보내기'로 분리한다.", "Apple 5.3.2에 따라 경품 이벤트는 앱 안에 공식 규칙을 보여 줘야 하므로, 이벤트 상세의 유의사항 영역은 사실상 필수다.", "G마켓은 2026년 6월 출석체크와 쿠폰 페이지를 하나로 합쳤다. 보상 기준을 연속 출석에서 월 누적 방문 구간(10·20·30회)으로 바꾸고, 출석 중 랜덤으로 나오는 '숨겨진 보너스 캐시'를 추가했다.", "무신사는 2026년 7월 버즈빌과 제휴해 앱 안에 미션형 혜택 공간을 열었다. 럭키박스, 주간 미션, 행운 뽑기, 라이브 시청·밸런스 게임 미션으로 무신사머니를 적립하는 리워드 광고형 앱인앱이다.", "올리브영 '셔터'와 무신사 '스냅'은 하단 탭으로 들어가는 앱인앱 커뮤니티다. 콘텐츠에 태그된 상품을 누르면 상품 상세로 이동하고, 무신사 스냅은 해당 상품이 없을 때 유사 상품을 보여 준다.", "11번가 LIVE11은 유튜브와 동시 송출하면서 상품 배너로 11번가 상품 화면에 연결했고, LIVE11 탭에 카테고리별 큐레이션을 두었다.", "네이버 쇼핑은 라이브 방송 알림을 '관심 스토어' 알림에 묶어 관리한다. '알림받는중' 버튼을 누르고 확인창에서 해제하는 방식이다.", "쿠팡 라이브는 방송·판매용 별도 앱('쿠팡 라이브 크리에이터')으로 분리되어 있다.", "국내 대형 몰(쿠팡·11번가)이 홈 화면 위젯을 출시했다는 근거는 찾지 못해 위젯은 '일반 관행'으로만 넣었다. 올리브영·11번가의 상시 출석체크·룰렛도 확인되지 않았다."]}], "legalUnverified": ["A-24: Google Play 'Prominent Disclosure and Consent Requirement'는 정책 센터 원문을 직접 확인하지 못함. 고객센터의 사용자 데이터 정책 요약과 모범사례 페이지(answer 10144311, 11150561)로만 발동 조건(사용자가 예상하기 어려운 수집)을 확인함", "A-16: ATT 사전 안내 화면에서 '시스템 팝업 모방 금지'의 근거(Apple HIG 등)는 원문을 확인하지 못함. 사전 설명 허용, 보상·기능 제한 연계 금지는 Apple 'User Privacy and Data Use' 페이지와 5.1.1(iv)·5.1.2(i)로 확인함", "A-10·A-15: 방송미디어통신위원회(구 방통위)의 「스마트폰 앱 접근권한 개인정보보호 안내서」와 「불법스팸 방지 안내서」(앱 푸시가 전자적 전송매체에 해당한다는 해석) 원문은 확인하지 못함. 조문(정보통신망법 제22조의2·제50조, 시행령 제9조의2·제61조~제62조의3)만 확인함", "A-19: 공정위 전자상거래 표준약관의 약관 변경 공지 조항은 확인하지 못함. 일반 약관 변경 고지는 법정 의무가 아니라는 판단은 전자상거래법·약관 관련 조문에서 해당 의무를 찾지 못한 데 근거함", "B-25: 국세청의 주류 통신판매 고시(전통주 등만 통신판매 허용) 원문은 확인하지 못함. 나이 확인 의무는 청소년보호법 제16조·제28조 제4항, 시행령 제17조로 확인함", "B-15: 개인정보위의 '필수 동의 관행 개선' 해설 자료 원문은 확인하지 못함. 계약 이행 항목을 동의 없이 처리할 수 있다는 점은 개인정보보호법 제15조 제1항 제4호·제22조 제3항 조문으로만 확인함", "B-43: Google 계정 삭제 요구사항 중 '계정을 지우지 않는 일부 데이터 삭제 요청'이 선택 사항이라는 점은 페이지에서 명시적으로 확인하지 못함(필수 항목에서만 제외해 판단함)", "참고: 법령은 law.go.kr 현행본(전자상거래법 2026-07-21 시행, 정보통신망법 2026-10-02 시행, 개인정보보호법 2026-09-11 시행, 시행령 각 현행본)으로 확인했고 Apple 심사지침은 developer.apple.com 현행본으로 확인함", "D-28·D-29: 상품정보제공고시 별표의 품목별 항목표는 이미지라 원문을 읽지 못했다. 40개 품목 목록(사료 품목 없음, 화장품은 (18))만 확인했고, 화장품 전성분이 항목에 들어 있다는 점은 2차 지식 기준이다.", "C-11·D-02: 가격표시제 실시요령(산업부 고시) 원문을 확인하지 못했다. 온라인 단위가격 의무 대상(연간 거래금액 10조원 이상, 2026-04-07 시행, 계도 6개월)은 언론 보도 기준이다.", "C-11·D-02: 공정위 다크패턴 문답서와 전자상거래 소비자보호지침 원문을 확인하지 못했다. 배송비가 원칙적으로 총금액에 들어간다는 점과 '첫 화면'이 검색·카테고리 목록이라는 해석은 2차 자료 기준이다.", "C-15: 검색 광고에 '광고' 라벨을 붙이라는 현행 조문을 찾지 못했다. 2021년 전부개정안의 검색광고 구분 표시 조항은 현행 전자상거래법에 없고, 라벨 근거는 표시광고법 제3조 해석에 의존한다.", "D-39: 시행 후 3개월 계도기간 주장은 공정위 공지 원문으로 확인하지 못했다. 판정에는 영향이 없다.", "E-47: 개인정보위가 오픈마켓 판매자 제공에 제17조 제4항(추가 제공)을 적용할 수 있다고 본 공식 해설은 확인하지 못했다. 조문 문언에 따라 가장 보수적으로 동의가 필요하다고 판정했다.", "C-16: 청소년 보호법 시행령(제16조 대상 매체물 범위, 나이·본인 확인 방법) 원문을 확인하지 못했다.", "E-42: 전자금융거래법 제24조의 약관 명시 방법(금융위 고시)과 PG 브랜드페이 약관 동의를 몰 화면에서 받아야 하는지는 확인하지 못했다.", "D-46: Apple 1.2와 Google UGC 정책은 문언만 확인했다. 쇼핑앱의 상품 리뷰에 심사에서 실제로 신고·차단을 요구하는지는 확인할 수 없다.", "G-78: 전자금융감독규정에 분실·도난 신고를 24시간 접수할 의무가 있는지 원문을 확인하지 못했다. 전자금융거래법 제10조와 시행령 제9조(배상 책임 배분)만 확인했다.", "F-67·G-27·G-78: 몰 자체 상품 구매에만 쓰는 충전금이 전자금융거래법 제2조 제14호의 선불전자지급수단('발행인 외 제3자로부터 구입'에 쓰는 것)에 해당하는지에 대한 금융위 해석을 확인하지 못했다. 해당하지 않으면 세 항목 모두 법정 의무가 아니다.", "F-30: 소비자보호지침 Ⅱ.14(신구조문 대비표)의 '구매취소'에 배송 후 청약철회(반품)가 들어가는지 지침에 명시가 없다. 그래서 같은 앱 안에서 반품까지 받아야 하는지는 해석의 여지가 있다.", "J-03: 2026-03-04 KISA·방송미디어통신위원회의 「불법 스팸 방지를 위한 정보통신망법 안내서」 7차 개정본 원문은 보지 못했다. '앱푸시 광고 거부에 로그인 요구 불가'는 보안뉴스 보도로만 확인했다. 다만 시행령 별표 6 공통 제2호(연락처 외 정보 요구 금지)는 원문으로 확인했다.", "H-30·H-31·G-47: Apple 1.2와 Google Play UGC 정책이 상품 리뷰만 있는 커머스 앱에 실제로 적용되는지 확인하지 못했다. 조항 원문에 리뷰 언급이 없고 심사 관행은 미확인이다.", "J-21: 시행령 제14조 제6항 제1호가 인용하는 디지털포용법 시행령 제24조 제2항의 과기정통부 고시(앱 접근성 검증기준) 원문은 확인하지 못했다.", "H-01: 전자상거래법 시행규칙의 사이버몰 표시 방법(초기화면 표시 등) 원문은 확인하지 못했다. 하향 판단에는 영향이 없다.", "F-15: 전자상거래법 제15조 제3항 후단에 따른 공정위 고시(공급 진행상황 확인 조치 세부사항)가 있는지 확인하지 못했다.", "인공지능기본법 과태료 계도기간의 범위와 종료 시점: 과기정통부 공식 문서를 찾지 못했다. '최소 1년'은 언론·법률 해설로만 확인했다(K-30).", "App Store 1.2의 UGC 이용약관(EULA) 동의 요구: 가이드라인 본문에는 없다. 심사 반려 문구에서 요구한다는 관행은 공식 원문으로 확인하지 못했다(K-26).", "Google Play UGC 정책이 상품 리뷰를 UGC로 보는지: 정책 페이지에 명시가 없다. 정의상 포함될 가능성이 높다고 보고 판단했다(K-26).", "공정위 「온라인 다크패턴 자율관리 가이드라인」의 사례 원문 미확인: 앱 설치·알림 동의 유도 팝업이 전자상거래법 제21조의2 제1항 제5호에 해당하는지는 법조문 문언으로만 판단했다(L-03).", "개인정보위 「개인정보 처리방침 작성지침」과 동의 안내서 원문 미확인: K-03·K-06·K-09는 법·시행령 조문으로만 판단했다.", "위치정보법 시행령에서 약관 기재 사항을 추가로 정한 부분(제18조 제1항 제5호, 제19조 제1항 제5호의 위임 사항) 미확인(K-11).", "전자금융거래법 시행령의 선불전자지급수단 등록 면제 금액 기준(제28조 제3항 제1호 나목) 미확인(K-17).", "청소년 보호법 시행령의 나이·본인 확인 방법 미확인(L-10).", "리서처가 근거로 단 외부 링크(cafe24, byline.network, chewy, musinsa, tosspayments, skax, shinkim 등)는 열어 보지 않았다. 법령 원문은 국가법령정보센터 Open API로 현행본을 받아 대조했다(전자상거래법 2026-07-21 시행본, 개인정보 보호법 2026-09-11, 정보통신망법 2026-10-02, 전자금융거래법 2026-10-02, 청소년 보호법 2026-10-08, 위치정보법 2025-10-01, 인공지능기본법 2026-01-22)."], "researcherLabels": {"kr-openmarket": "국내 종합몰·오픈마켓 (쿠팡·11번가·G마켓·SSG)", "kr-vertical": "국내 버티컬 (무신사·29CM·지그재그·에이블리·올리브영·컬리)", "kr-platform": "국내 플랫폼 커머스 (네이버·카카오 선물하기·오늘의집·토스쇼핑)", "pet": "반려동물 커머스 (어바웃펫·펫프렌즈·핏펫몰·Chewy·Petco)", "global-big": "해외 대형 리테일 (Amazon·Walmart·Target)", "global-crossborder": "해외 크로스보더·패션 (Shein·Temu·AliExpress·Zalando·ASOS·Etsy)", "solution-templates": "쇼핑몰 솔루션·템플릿 (Cafe24·고도몰·Shopify·WooCommerce·Baymard)", "legal-policy": "법령·앱스토어 정책", "payment-postpurchase": "결제·주문 후 플로우", "app-system-engagement": "앱 공통·회원·설정·CS·참여"}, "memo": {"intro": "기획 메모의 항목을 이 목록의 화면에 연결했습니다. 화면을 누르면 목록에서 해당 화면이 펼쳐집니다.", "rows": [{"item": "장바구니", "level": 1, "names": ["장바구니", "장바구니 담기 완료 시트", "장바구니 빈 상태"], "note": "장바구니 옵션 변경은 옵션 선택 바텀시트를 재사용합니다.", "ids": ["E-01", "L-14", "E-03"]}, {"item": "구매 (바로구매 포함)", "level": 2, "names": ["상품 상세", "옵션 선택 바텀시트", "주문서", "결제수단 선택", "PG 결제창", "외부 간편결제 결제창", "결제 완료", "결제 실패"], "note <script>

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); };

  };

  document.getElementById('lede').textContent = '국내외 쇼핑몰과 쇼핑몰 솔루션, 법령·앱스토어 정책을 조사해 커머스 몰 구축에 필요한 화면 ' + S.length + '개를 ' + CATS.length + '개 영역으로 정리했습니다. 행을 누르면 핵심 요소, 변형 상태, 확인한 몰, 근거가 펼쳐집니다.';
  document.getElementById('tldr').innerHTML =
    '<p><b>결론</b> 1차 오픈에 꼭 있어야 하는 화면은 조건 없는 법령·스토어 필수 ' + nLegal + '개와 핵심(MVP) ' + nMvp + '개입니다. 조건부 필수 ' + nCond + '개는 해당 기능을 열 때 함께 넣습니다.</p>' +
    '<p><b>근거</b> 쇼핑몰·쇼핑몰 솔루션·결제사 등 ' + nMalls + '곳에서 확인한 화면을 모았고, 법적필수 판정은 조문 단위로 다시 검증했습니다.</p>' +
    '<p><b>다음</b> 권장 ' + nRec + '개는 2차 범위로, 선택·차별화 ' + nOpt + '개는 우리 몰 전략에 맞춰 고르면 됩니다.</p>';

  // legend + chips
  document.getElementById('legend').innerHTML = NEEDS.map(function (n) { return '<span><i class="' + SEG[n] + '"></i>' + esc(n) + '</span>'; }).join('');
  var chips = document.getElementById('needChips');
  chips.innerHTML = NEEDS.map(function (n) { return '<button type="button" class="chip ' + NCLS[n] + '" aria-pressed="true" data-need="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var n = b.getAttribute('data-need');
    if (state.needs.has(n)) state.needs.delete(n); else state.needs.add(n);
    b.setAttribute('aria-pressed', state.needs.has(n) ? 'true' : 'false');
    render();
  });
  var kindSel = document.getElementById('kind');
  kindSel.innerHTML = '<option value="all">전체</option>' + KINDS.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + '</option>'; }).join('');
  kindSel.addEventListener('change', function () { state.kind = kindSel.value; render(); });
  var q = document.getElementById('q');
  q.addEventListener('input', function () { state.q = q.value.trim().toLowerCase(); render(); });

  // memo mapping
  if (D.memo && D.memo.rows && D.memo.rows.length) {
    var mm = document.getElementById('memo');
    var known = {}; S.forEach(function (s) { known[s.id] = s; });
    mm.innerHTML = '<h2>메모 항목 대조</h2><p>' + esc(D.memo.intro || '') + '</p><div class="memo-scroll"><table><thead><tr><th>메모 항목</th><th>대응 화면</th><th>비고</th></tr></thead><tbody>' +
      D.memo.rows.map(function (r) {
        var ids = (r.ids || []).filter(function (i) { return known[i]; }).map(function (i) { return '<a class="idl" href="#' + i + '" data-open="' + i + '" title="' + esc(known[i].name) + '">' + i + ' ' + esc(known[i].name) + '</a>'; }).join('');
        return '<tr><td class="' + (r.level === 2 ? 'lv2' : 'lv1') + '">' + esc(r.item) + '</td><td>' + (ids || '<span class="gap">해당 없음</span>') + '</td><td>' + esc(r.note || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    mm.hidden = false;
    mm.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-open]'); if (!a) return;
      e.preventDefault();
      state.q = ''; q.value = ''; state.kind = 'all'; kindSel.value = 'all';
      state.needs = new Set(NEEDS);
      Array.prototype.forEach.call(chips.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', 'true'); });
      render();
      var el = document.getElementById(a.getAttribute('data-open'));
      if (el) { el.open = true; el.scrollIntoView({ block: 'center' }); el.querySelector('summary').focus({ preventScroll: true }); }
    });
  }

  // bars (static, full data)
  var maxN = Math.max.apply(null, CATS.map(function (c) { return S.filter(function (s) { return s.category === c; }).length; }));
  document.getElementById('bars').innerHTML = CATS.map(function (c) {
    var items = S.filter(function (s) { return s.category === c; });
    var segs = NEEDS.map(function (n) {
      var k = items.filter(function (s) { return s.necessity === n; }).length;
      return k ? '<span class="' + SEG[n] + '" style="width:' + (k / maxN * 100) + '%" title="' + esc(n) + ' ' + k + '개"></span>' : '';
    }).join('');
    return '<button type="button" class="bar-row" data-cat="' + c + '"><span class="bar-label"><code>' + c + '</code>' + esc(catName(c)) + '</span><span class="bar-track" style="background:none">' + segs + '</span><span class="bar-n">' + items.length + '</span></button>';
  }).join('');
  document.getElementById('bars').addEventListener('click', function (e) {
    var b = e.target.closest('.bar-row'); if (!b) return;
    var el = document.getElementById('cat-' + b.getAttribute('data-cat'));
    if (el) el.scrollIntoView({ block: 'start' });
  });

  function match(s) {
    if (!state.needs.has(s.necessity)) return false;
    if (state.kind !== 'all' && s.kind !== state.kind) return false;
    if (!state.q) return true;
    var hay = [s.id, s.name, s.aliases, s.purpose, s.key_elements, s.variants, (s.seen_in || []).join(' '), s.notes, s.kind, s.necessity, s.legal_basis, s.condition, s.entry_points].join(' ').toLowerCase();
    return state.q.split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
  }

  var current = [];
  function rowHtml(s) {
    var mallsHtml = (s.seen_in || []).map(function (m) { return '<span class="mall">' + esc(m) + '</span>'; }).join('');
    var dl = '';
    if (s.key_elements) dl += '<dt>핵심 요소</dt><dd>' + esc(s.key_elements) + '</dd>';
    if (s.variants) dl += '<dt>변형·상태</dt><dd>' + esc(s.variants) + '</dd>';
    if (s.aliases) dl += '<dt>다른 이름</dt><dd>' + esc(s.aliases) + '</dd>';
    dl += '<dt>종류</dt><dd>' + esc(s.kind) + '</dd>';
    if (mallsHtml) dl += '<dt>확인한 곳</dt><dd>' + mallsHtml + '</dd>';
    if (s.legal_basis) dl += '<dt>법적 근거</dt><dd>' + esc(s.legal_basis) + '</dd>';
    if (s.condition) dl += '<dt>적용 조건</dt><dd>' + esc(s.condition) + '</dd>';
    if (s.entry_points) dl += '<dt>진입 경로</dt><dd>' + esc(s.entry_points) + '</dd>';
    if (s.evidence) dl += '<dt>출처</dt><dd>' + linkify(s.evidence) + '</dd>';
    if (s.notes) dl += '<dt>설계 유의점</dt><dd>' + esc(s.notes) + '</dd>';
    if (s.added_by) dl += '<dt>보강 경위</dt><dd>' + esc(s.added_by) + '에서 누락으로 판정되어 추가</dd>';
    if (s.merged_from) dl += '<dt>합친 화면</dt><dd>' + esc(s.merged_from.join(', ')) + '</dd>';
    if (s.review_note) dl += '<dt>검토 메모</dt><dd>' + esc(s.review_note) + '</dd>';
    else if (s.enriched) dl += '<dt>검토 메모</dt><dd>' + esc(s.enriched) + '</dd>';
    return '<details class="row" id="' + esc(s.id) + '"><summary>' +
      '<span class="id">' + esc(s.id) + '</span>' +
      '<span class="nm"><b>' + esc(s.name) + '</b>' + (s.added_by ? '<span class="added">보강</span>' : '') + '</span>' +
      '<span class="pp">' + esc(s.purpose) + '</span>' +
      '<span class="badge ' + NCLS[s.necessity] + '">' + esc(s.necessity) + (s.condition ? '<span class="cond" title="' + esc(s.condition) + '">조건부</span>' : '') + '</span>' +
      '<span class="kd">' + esc(s.kind) + '</span>' +
      '</summary><div class="more"><dl>' + dl + '</dl></div></details>';
  }

  function render() {
    current = S.filter(match);
    document.getElementById('count').textContent = current.length + ' / ' + S.length + '개';
    var html = '';
    CATS.forEach(function (c) {
      var items = current.filter(function (s) { return s.category === c; });
      if (!items.length) return;
      html += '<section class="cat" id="cat-' + c + '"><div class="cat-head"><code>' + c + '</code><h2>' + esc(catName(c)) + '</h2><span class="count">' + items.length + '개</span><span class="sub">' + esc(catSub(c)) + '</span></div><div class="rows">' + items.map(rowHtml).join('') + '</div></section>';
    });
    document.getElementById('list').innerHTML = html || '<p class="empty-state">조건에 맞는 화면이 없습니다. 검색어를 지우거나 필요도 필터를 다시 켜 보세요.</p>';
    document.getElementById('rail').innerHTML = CATS.map(function (c) {
      var n = current.filter(function (s) { return s.category === c; }).length;
      return '<a href="#cat-' + c + '"' + (n ? '' : ' class="empty"') + '><code>' + c + '</code><span>' + esc(catName(c)) + '</span><span class="n">' + n + '</span></a>';
    }).join('');
  }
  render();

  // copy TSV
  var toast = document.getElementById('toast');
  document.getElementById('copy').addEventListener('click', function () {
    var clean = function (v) { return String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' '); };
    var head = ['ID', '영역', '화면명', '목적', '핵심 요소', '변형·상태', '종류', '필요도', '적용 조건', '법적 근거', '확인한 곳', '출처'];
    var lines = [head.join('\t')].concat(current.map(function (s) {
      return [s.id, catName(s.category), s.name, s.purpose, s.key_elements, s.variants, s.kind, s.necessity, s.condition, s.legal_basis, (s.seen_in || []).join(', '), s.evidence].map(clean).join('\t');
    }));
    var text = lines.join('\n');
    var done = function () { toast.textContent = current.length + '개 행을 복사했습니다. 노션·스프레드시트에 붙여 넣으세요.'; };
    var fallback = function () {
      var ta = document.getElementById('fallback');
      ta.hidden = false; ta.value = text; ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast.textContent = '복사가 막혀 있습니다. 선택된 텍스트를 직접 복사하세요.'; }
      ta.hidden = true;
    };
    try {
      navigator.clipboard.writeText(text).then(done, fallback);
    } catch (e) { fallback(); }
  });

  // appendix
  var RID = D.researcherLabels || {};
  var st = D.stats || {};
  var srcByR = {};
  (D.sources || []).forEach(function (s) { (srcByR[s.rid] = srcByR[s.rid] || []).push(s); });
  var appx = '<h2>조사 방법과 출처</h2>';
  var rf = st.refine || {};
  appx += '<div class="method"><p>리서처 10명이 몰·주제별로 화면을 수집했고, 영역별로 중복을 병합했습니다. 이어서 여정·법규·벤치마크 세 관점의 검토자가 누락을 찾아 보강했습니다. 그 뒤 영역 사이에 남은 중복을 두 검토자가 따로 찾아 합쳤습니다. 법적필수는 조문 단위로 다시 검증했고, 1차 오픈 기준으로 필요도를 재분류했습니다. 2단계 인증 화면은 별도로 조사해 넣었습니다. <b>보강</b> 표시가 붙은 화면이 누락 검토와 2단계 인증 조사로 추가된 화면입니다.</p>' +
    '<table><tr><th>단계</th><th>개수</th></tr><tr><td>원시 수집 항목</td><td>' + (st.raw || '-') + '</td></tr>' +
    (st.criticLog || []).map(function (r) { return '<tr><td>누락 검토 ' + r.round + '차: 후보 ' + r.candidates + '개 중 신규 추가</td><td>' + r.added + '</td></tr><tr><td>누락 검토 ' + r.round + '차: 기존 화면 변형으로 흡수</td><td>' + r.variant_merged + '</td></tr>'; }).join('') +
    '<tr><td>영역 간 중복으로 합친 화면</td><td>' + (rf.merged || '-') + '</td></tr>' +
    '<tr><td>법적·스토어 필수 검증: 유지·조건부 유지</td><td>' + (rf.legalKept || '-') + '</td></tr>' +
    '<tr><td>법적·스토어 필수 검증: 하향</td><td>' + (rf.legalDowngraded || '-') + '</td></tr>' +
    '<tr><td>1차 오픈 기준 필요도 재분류</td><td>' + (rf.mvpChanged || '-') + '</td></tr>' +
    '<tr><td>2단계 인증 추가 조사로 추가</td><td>' + S.filter(function (x) { return x.added_by === '2단계 인증 추가 조사'; }).length + '</td></tr>' +
    '<tr><td>최종 화면</td><td>' + S.length + '</td></tr></table></div>';
  if (D.legalUnverified && D.legalUnverified.length) {
    appx += '<details><summary>법령 검증에서 원문을 확인하지 못한 항목 ' + D.legalUnverified.length + '건</summary><ul>' + D.legalUnverified.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></details>';
  }
  appx += '<details><summary>조사 범위별 특이 화면</summary>' + (D.uniqueFindings || []).map(function (u) {
    return '<h3>' + esc(RID[u.rid] || u.rid) + '</h3><ul>' + u.findings.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
  }).join('') + '</details>';
  appx += '<details><summary>출처 ' + (D.sources || []).length + '건</summary>' + Object.keys(srcByR).map(function (r) {
    return '<h3>' + esc(RID[r] || r) + '</h3><ul>' + srcByR[r].map(function (s) { return '<li>' + esc(s.title) + ' · ' + linkify(s.url) + '</li>'; }).join('') + '</ul>';
  }).join('') + '</details>';
  document.getElementById('appx').innerHTML = appx;
})();
</script>
</body>
</html>
