<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>대항해 마블 · Voyage Marble</title>
<style>
  :root{
    --parch:#efe2c4; --parch-2:#e3d2a8; --ink:#2b2113; --ink-soft:#6b5a3a;
    --sea:#2a6f97; --sea-deep:#014f86; --sea-light:#61a5c2;
    --gold:#c9962f; --gold-lt:#f0c65a; --line:#b79a5e;
    --p0:#c0392b; --p1:#2471a3; --p2:#1e8449; --p3:#b7950b;
    --card:#fbf5e6; --shadow:0 8px 30px rgba(30,20,5,.28);
    --asia:#c0392b; --europe:#2471a3; --medi:#138d75; --newworld:#7d3c98; --atlantic:#0e7c9b; --orient:#c77d10;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 15% -10%, #1c5878 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 120%, #0b3a56 0%, transparent 55%),
      linear-gradient(160deg,#0e3f5c 0%,#08324b 100%);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:none;margin:0;padding:12px 16px 20px}
  header.top{display:flex;align-items:baseline;gap:14px;color:#f4ead0;margin-bottom:10px;flex-wrap:wrap}
  header.top h1{font-size:26px;letter-spacing:.5px;font-weight:800}
  header.top .en{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#f0c65a;font-weight:700}
  header.top .sub{font-size:12.5px;color:#bfe0f0;margin-left:auto}
  .mute-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#f4ead0;
    width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer;flex:0 0 auto}
  .mute-btn:hover{background:rgba(255,255,255,.2)}
  .mute-btn.off{opacity:.55}

  /* ===== Setup screen ===== */
  .setup{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:26px 26px 24px;max-width:560px;margin:6vh auto 0}
  .setup h2{font-size:20px;margin-bottom:4px}
  .setup p.desc{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;line-height:1.5}
  .count-row{display:flex;gap:8px;margin-bottom:18px}
  .count-row button{flex:1;padding:10px;border:2px solid var(--line);background:#fff;border-radius:10px;
    font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
  .count-row button.active{background:var(--sea-deep);color:#fff;border-color:var(--sea-deep)}
  .slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:#fff}
  .slot .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(0,0,0,.15)}
  .slot input{flex:1;border:none;font-size:15px;font-weight:600;color:var(--ink);background:transparent;outline:none;min-width:0}
  .slot .toggle{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  .slot .toggle button{border:none;background:#fff;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
  .slot .toggle button.on{background:var(--gold);color:#3a2c0a}
  .start-btn{width:100%;margin-top:14px;padding:13px;border:none;border-radius:11px;background:var(--gold);
    color:#3a2c0a;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #a9781c}
  .start-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a9781c}

  /* ===== Game layout ===== */
  .game{display:none;gap:18px;align-items:flex-start}
  .game.live{display:flex;flex-wrap:wrap}
  .board-wrap{background:var(--sea);border:6px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);
    position:relative;flex:0 0 auto}
  #board{position:relative;background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 12px, transparent 12px 24px),
      radial-gradient(circle at 50% 45%, #3f88ad 0%, #1f5f83 55%, #0b3f5e 100%);
  }
  .tile{position:absolute;background:var(--parch);border:1.5px solid var(--line);border-radius:7px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);cursor:default}
  .tile .band{height:8px;flex:0 0 auto}
  .tile .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px 3px;text-align:center}
  .tile .nm{font-size:9.5px;font-weight:800;line-height:1.05;color:var(--ink)}
  .tile .pr{font-size:8.5px;color:var(--ink-soft);margin-top:1px;font-weight:600}
  .tile .lvl{font-size:8.5px;color:var(--gold);font-weight:800;letter-spacing:1px;height:10px}
  .tile.special .body{padding:2px}
  .tile.special .ic{font-size:20px;line-height:1}
  .tile.special .nm{font-size:9.5px;margin-top:2px}
  .tile.port .body{background:linear-gradient(180deg,#fbf5e6,#f3e6c4)}
  .tile .owner-badge{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;display:none}
  .tile.festival-on::after{content:"🎪";position:absolute;top:1px;left:2px;font-size:11px}
  .tile.hl{outline:3px solid var(--gold-lt);outline-offset:-1px;z-index:5;cursor:pointer}
  .tile.clickable{cursor:pointer}
  .tile.clickable:hover{filter:brightness(1.06)}
  /* small port chips on sea routes */
  .tile.sea{border-width:1px;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:3}
  .tile.sea .band{height:4px}
  .tile.sea .body{padding:0 1px;justify-content:center}
  .tile.sea .nm{font-size:7.5px;font-weight:800;line-height:1.0}
  .tile.sea .pr{display:none}
  .tile.sea .lvl{font-size:7px;height:7px;letter-spacing:0}
  .tile.sea .owner-badge{width:8px;height:8px;top:1px;right:1px;border-width:1px}
  .center-crest{position:absolute;left:23%;top:40%;transform:translate(-50%,-50%);text-align:center;color:#eaf4fb;pointer-events:none;width:22%}
  .center-crest .compass{font-size:46px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .center-crest .ttl{font-size:18px;font-weight:800;letter-spacing:1px;margin-top:2px;color:#f0c65a}
  .center-crest .en2{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#cfe6f2}
  .silk-label{position:absolute;color:#f3d9a6;font-size:10px;font-weight:800;letter-spacing:1px;transform:translate(-50%,-50%);
    text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
  .token{position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid #fff;z-index:8;background:#fff;
    box-shadow:0 3px 6px rgba(0,0,0,.45);transition:left .21s ease,top .21s ease;display:flex;align-items:center;justify-content:center;
    font-size:17px;line-height:1}
  .token.hop{animation:hop .22s ease}
  @keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-13px) scale(1.18)}100%{transform:translateY(0)}}
  svg.silk-path{position:absolute;left:0;top:0;pointer-events:none;z-index:1}

  /* ===== Side panel ===== */
  .side{flex:1;min-width:290px;display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 13px}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard{border:1.5px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;position:relative;overflow:hidden}
  .pcard .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .pcard.turn{box-shadow:0 0 0 2px var(--gold);border-color:var(--gold)}
  .pcard.out{opacity:.45;filter:grayscale(.6)}
  .pcard .pn{font-size:13px;font-weight:800;padding-left:6px;display:flex;align-items:center;gap:5px}
  .pcard .pn .ai{font-size:9px;background:var(--ink-soft);color:#fff;border-radius:4px;padding:1px 4px;font-weight:700}
  .pcard .money{font-size:15.5px;font-weight:800;padding-left:6px;margin-top:2px;color:var(--sea-deep)}
  .pcard .meta{font-size:10.5px;color:var(--ink-soft);padding-left:6px;margin-top:1px}

  .diebox{display:flex;align-items:center;gap:12px;justify-content:center}
  .die{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .die.roll{animation:tumble .3s linear infinite}
  @keyframes tumble{0%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-9px) rotate(90deg) scale(1.12)}
    50%{transform:translateY(0) rotate(180deg) scale(1)}75%{transform:translateY(-6px) rotate(270deg) scale(1.12)}100%{transform:translateY(0) rotate(360deg) scale(1)}}
  .die.pop{animation:diepop .26s ease}
  @keyframes diepop{0%{transform:scale(1.4)}55%{transform:scale(.9)}100%{transform:scale(1)}}
  .turn-line{text-align:center;font-size:13.5px;font-weight:700;margin-bottom:9px;min-height:19px}
  .roll-btn{width:100%;margin-top:11px;padding:12px;border:none;border-radius:10px;background:var(--sea-deep);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #013a63}
  .roll-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #013a63}
  .roll-btn:disabled{background:#9fb4c0;box-shadow:0 4px 0 #7d9099;cursor:default}

  .log{font-size:12px;line-height:1.55;color:var(--ink);max-height:150px;overflow-y:auto;display:flex;flex-direction:column-reverse}
  .log .l{padding:2px 0;border-bottom:1px dashed #e2d3ac}
  .log .l b{color:var(--sea-deep)}
  .panel h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;font-weight:800}

  /* ===== Modal ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(10,25,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);border:2px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);
    padding:20px 20px 18px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto}
  .modal h3{font-size:18px;margin-bottom:6px;color:var(--ink)}
  .modal .mbody{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:14px}
  .modal .mbody .big{font-size:15px;font-weight:800}
  .mbtns{display:flex;gap:9px;flex-wrap:wrap}
  .mbtns button{flex:1;min-width:110px;padding:11px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer}
  .mb-primary{background:var(--gold);color:#3a2c0a;box-shadow:0 3px 0 #a9781c}
  .mb-ghost{background:#fff;border:1.5px solid var(--line)!important;color:var(--ink-soft)}
  .mb-primary:active,.mb-ghost:active{transform:translateY(2px)}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
  .pick-grid button{padding:8px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
  .pick-grid button:hover{background:var(--parch)}
  .win-emoji{font-size:46px;text-align:center}
  /* ===== Money toast ===== */
  #toastBox{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
  .toast{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;animation:tin .25s ease;white-space:nowrap}
  .toast .te{font-size:16px}
  .toast .tv{font-weight:800;font-size:14px}
  .toast.gain{border-color:#7fc99b}.toast.gain .tv{color:#1e8449}
  .toast.spend{border-color:#e0a39c}.toast.spend .tv{color:#c0392b}
  .toast .tr{font-size:10.5px;color:var(--ink-soft);font-weight:600}
  .toast.out{opacity:0;transform:translateY(-10px);transition:.4s ease}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  footer.foot{margin-top:26px;text-align:center;color:#9dc2d6;font-size:11.5px;letter-spacing:.4px}
  footer.foot a{color:#f0c65a;text-decoration:none}
  @media (max-width:760px){
    .game.live{justify-content:center}
    .side{flex-basis:100%}
  }
  @media (max-width:640px){
    .app{padding:12px 12px 40px}
    header.top h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="en">Voyage Marble</span>
    <h1>⚓ 대항해 마블</h1>
    <span class="sub">모두의 마블 × 모노폴리 · 대항해시대 세계지도판</span>
    <button id="muteBtn" class="mute-btn" title="소리 켜기/끄기">🔊</button>
  </header>

  <!-- Setup -->
  <section class="setup" id="setup">
    <h2>새 항해 준비</h2>
    <p class="desc">주사위를 굴려 세계 도시를 매입하고 통행료로 상대를 파산시키세요. 기본은 <b>육로 세계일주</b>입니다. 항구에서 주사위 합이 <b>홀수면 바닷길</b>, <b>짝수면 육로</b>로 갑니다 — <b>⛵ 대서양 항로</b>(리스본→뉴욕) / <b>⛵ 동방 항로</b>(암스테르담→서울).</p>
    <h3 style="font-size:12px;letter-spacing:1px;color:var(--ink-soft);font-weight:800;margin-bottom:8px">플레이어 수</h3>
    <div class="count-row" id="countRow"></div>
    <div id="slots"></div>
    <button class="start-btn" id="startBtn">⚓ 항해 시작</button>
  </section>

  <!-- Game -->
  <section class="game" id="game">
    <div class="board-wrap">
      <div id="board"></div>
    </div>
    <div class="side">
      <div class="panel">
        <h3>선단 현황</h3>
        <div class="players" id="players"></div>
      </div>
      <div class="panel">
        <div class="turn-line" id="turnLine"></div>
        <div class="diebox"><div class="die" id="d1">?</div><div class="die" id="d2">?</div></div>
        <button class="roll-btn" id="rollBtn">🎲 주사위 굴리기</button>
      </div>
      <div class="panel">
        <h3>항해 일지</h3>
        <div class="log" id="log"></div>
      </div>
    </div>
  </section>

  <footer class="foot">데모 프로토타입 · 자체완결 단일 HTML · <a href="https://kennethkarl.github.io/portfolio/" target="_blank" rel="noopener">← 포트폴리오</a></footer>
</div>

<div id="toastBox"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ============================================================
   대항해 마블 (Voyage Marble)
   자체완결 단일 HTML 보드게임 — 바닐라 JS
   ============================================================ */

const CFG = {
  START_MONEY: 2000000,
  SALARY: 200000,
  TAX: 200000,
  ISLAND_FEE: 300000,
  AI_SAFE_BUFFER: 350000,
  CELL: 72, TILE: 66, SEA_TILE: 34, PAD: 4,
  BUILD_LABELS:["","별장","빌딩","호텔","랜드마크"],
  TOLL_MULT:[0.10,0.50,1.50,4.00,7.00],   // land, villa, building, hotel, landmark
  PORT_LANDMARK_MULT:9.00,
  BUILD_COST_RATE:0.60,
};
const GROUP_KO = {asia:"아시아",europe:"유럽",medi:"지중해",newworld:"신대륙",atlantic:"대서양",orient:"동방"};

/* ---------- SFX (Web Audio, synthesized — no external files) ---------- */
const SFX={
  ctx:null, on:true,
  ensure(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.on=false; return; } }
    if(this.ctx.state==="suspended") this.ctx.resume();
  },
  play(fn){ if(!this.on)return; this.ensure(); if(!this.ctx)return; try{ fn(); }catch(e){} },
  tone(freq,start,dur,type,peak){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+start;
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t); o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak||0.2,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(start,dur,cutoff,type,peak){
    const c=this.ctx,n=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b;
    const f=c.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=cutoff||1000;
    const g=c.createGain(),t=c.currentTime+start;
    s.connect(f); f.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak||0.2,t+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.start(t); s.stop(t+dur+0.02);
  },
  dice(){ this.play(()=>{ for(let i=0;i<6;i++) this.noise(i*0.055,0.045,2600,"bandpass",0.22); }); },   // 주사위 달그락
  key(){ this.play(()=>{ [784,1047,1319,1568].forEach((f,i)=>this.tone(f,i*0.08,0.28,"triangle",0.16)); }); }, // 황금열쇠 반짝
  gain(){ this.play(()=>{ [660,880,1100].forEach((f,i)=>this.tone(f,i*0.07,0.22,"triangle",0.15)); }); },      // 수입 상승음
  spend(){ this.play(()=>{ [520,390,300].forEach((f,i)=>this.tone(f,i*0.075,0.22,"triangle",0.13)); }); },     // 지출 하강음
  wave(){ this.play(()=>{ this.noise(0,0.30,650,"lowpass",0.16); this.noise(0.04,0.16,1400,"bandpass",0.07); }); }, // 배·바닷물
  hoof(){ this.play(()=>{ this.tone(190,0,0.08,"triangle",0.24); this.noise(0,0.045,2400,"bandpass",0.10); }); },   // 말발굽 clop
};

/* ---------- Board definition ----------
   Main loop = 28 nodes on an 8x8 perimeter, clockwise from START (bottom-right).
   Grid (gx=col 0..7, gy=row 0..7). Corners are specials.
   Atlantic sea route = optional ocean crossing 리스본(8) -> 아조레스 -> 버뮤다 -> 뉴욕(22).
*/
function makeLoopCoords(){
  const c=[];
  // bottom row: col 7..0 at row7  (idx 0..7)
  for(let col=7;col>=0;col--) c.push([col,7]);
  // left col: row 6..0 at col0    (idx 8..14)
  for(let row=6;row>=0;row--) c.push([0,row]);
  // top row: col 1..7 at row0     (idx 15..21)
  for(let col=1;col<=7;col++) c.push([col,0]);
  // right col: row 1..6 at col7   (idx 22..27)
  for(let row=1;row<=6;row++) c.push([7,row]);
  return c; // length 28
}
const LOOP=makeLoopCoords();

// helper to build a city node
function city(id,name,group,price,isPort){
  const [gx,gy]=LOOP[id];
  return {id,name,type:isPort?"port":"city",group,price,gx,gy,owner:null,level:0,festival:false,next:[(id+1)%28]};
}
function special(id,name,stype,icon){
  const [gx,gy]=LOOP[id];
  return {id,name,type:stype,icon,gx,gy,next:[(id+1)%28]};
}
// sea-route port node (interior tile with explicit coords + next)
function seaCity(id,name,group,price,gx,gy,nextId){
  return {id,name,type:"port",group,price,gx,gy,owner:null,level:0,festival:false,next:[nextId]};
}

const BOARD=[
  special(0,"출발","start","⛵"),
  city(1,"서울","asia",80000,false),
  city(2,"도쿄","asia",100000,false),
  special(3,"황금열쇠","chance","🗝️"),
  city(4,"이스탄불","medi",180000,true),
  city(5,"알렉산드리아","medi",160000,true),
  city(6,"카사블랑카","medi",90000,false),

function isCity(n){return n && (n.type==="city"||n.type==="port");}
function isSea(n){return n && (n.group==="atlantic"||n.group==="orient");}
function groupCities(group){return BOARD.filter(n=>isCity(n)&&n.group===group);}
function hasMonopoly(owner,group){
  if(owner==null)return false;
  const g=groupCities(group);
  return g.every(n=>n.owner===owner);
}
function ownedCities(pid){return BOARD.filter(n=>isCity(n)&&n.owner===pid);}
function netWorth(p){
  let w=p.money;
  ownedCities(p.id).forEach(n=>{ w+=n.price; for(let l=1;l<=n.level;l++) w+=buildCost(n); });
  return w;
}
function buildCost(n){return Math.round(n.price*CFG.BUILD_COST_RATE/1000)*1000;}
function tollOf(n){
  const mult = (n.level===4 && n.type==="port")?CFG.PORT_LANDMARK_MULT:CFG.TOLL_MULT[n.level];
  let toll=Math.round(n.price*mult/1000)*1000;
  if(hasMonopoly(n.owner,n.group))toll*=2;
  if(n.festival)toll*=2;
  return toll;
}

/* ---------- Movement ----------
   LAND is the base route. At a sea port, divert to the SEA route automatically when:
     - the player is docked here (stopped on this port last turn), OR
     - fewer than 6 steps remain to travel from this port (passing with a small number).
*/
// LAND is the base. At a sea port, ODD dice total -> board the sea route, EVEN -> stay on land.
function pickNext(p,node,rollTotal){
  if(node.next.length===1)return node.next[0];
  const sp=node.seaPort, odd=(rollTotal%2===1);
  if(odd)log(`${pname(p)} ⛵ ${sp.routeName} 출항 (홀수 ${rollTotal}) — ${sp.dest} 방면`);
  else log(`${pname(p)} 🛤️ ${node.name} 육로 통과 (짝수 ${rollTotal})`);
  return odd?node.next[1]:node.next[0];
}
async function movePlayer(p,steps){
  for(let i=0;i<steps;i++){
    const node=NODE(p.nodeId);
    const nextId=pickNext(p,node,steps);   // steps = full roll total → parity decides sea/land
    p.nodeId=nextId;
    if(nextId===0 && i<steps-1){ // passing START (not final landing)
      log(`${pname(p)} 출발 통과 · 봉급 +${won(CFG.SALARY)}`);
      await moneyEvent(p,CFG.SALARY,"출발 통과 봉급");
    }
    updateBoard();
    hopToken(p);
    if(isSea(NODE(nextId))) SFX.wave(); else SFX.hoof();   // 배=바닷물 / 육지=말발굽
    await delay(215);
  }
}

/* ---------- Landing resolution ---------- */
async function resolveLanding(p){
  const n=NODE(p.nodeId);
  if(isCity(n)){
    if(n.owner==null){ await tryBuy(p,n); }
    else if(n.owner===p.id){ await tryBuild(p,n); }
    else { await payToll(p,n); }
    return;
  }
  switch(n.type){
    case "start":
      log(`${pname(p)} 출발 도착 · 봉급 +${won(CFG.SALARY)}`);await moneyEvent(p,CFG.SALARY,"출발 봉급");break;
    case "island":
      p.inJail=true;p.jailTurns=0;log(`${pname(p)} 🏝️ 무인도에 정박 (탈출까지 대기)`);break;
    case "tax":
      log(`${pname(p)} 🏛️ 국세청 · 세금 ${won(CFG.TAX)}`);await charge(p,CFG.TAX,null);break;
    case "worldtour":
      await doWorldTour(p);break;
    case "chance":
      await doChance(p);break;
    case "festival":
      await doFestival(p);break;
  }
}

async function tryBuy(p,n){
  const price=n.price;
  if(p.money<price){log(`${pname(p)} ${n.name} 매입 불가 (자금 부족)`);return;}
  let buy;
  if(p.isAI){
    const completes=groupCities(n.group).filter(c=>c.owner===p.id).length===groupCities(n.group).length-1;
    buy=(p.money-price>CFG.AI_SAFE_BUFFER)&&(completes||p.money-price>CFG.AI_SAFE_BUFFER+price*0.5);
  }else{
    const v=await modalChoice(`🏙️ ${n.name} ${n.type==="port"?"⚓ 항구도시":""}`,
      `<b>${GROUP_KO[n.group]}</b> 대륙 · 매입가 <span class="big">${won(price)}</span><br>
       기본 통행료 ${won(tollOf({...n,level:0}))} · 독점 시 2배<br>보유 자금 ${won(p.money)}`,
      [{label:"패스",value:false},{label:`매입 (${won(price)})`,value:true,primary:true}]);
    buy=v;
  }
  if(buy){
    spendMoney(p,price,`${n.name} 매입`);n.owner=p.id;n.level=0;
    log(`${pname(p)} ${n.name} 매입 · -${won(price)}`);
    updateBoard();
  }else if(!p.isAI){log(`${pname(p)} ${n.name} 매입 패스`);}
}
async function tryBuild(p,n){
  if(n.level>=4){log(`${pname(p)} ${n.name}(랜드마크) 도착`);return;}
  const cost=buildCost(n);const nextLbl=CFG.BUILD_LABELS[n.level+1];
  if(p.money<cost){return;}
  let build;
  if(p.isAI){
    const mono=hasMonopoly(p.id,n.group);
    build=(p.money-cost>CFG.AI_SAFE_BUFFER)&&(mono||n.level<2);
  }else{
    const v=await modalChoice(`🏗️ ${n.name} 건설`,
      `현재 ${n.level>0?CFG.BUILD_LABELS[n.level]:"토지"} → <span class="big">${nextLbl}</span><br>
       건설비 ${won(cost)} · 건설 후 통행료 ${won(tollOf({...n,level:n.level+1}))}<br>보유 자금 ${won(p.money)}`,
      [{label:"패스",value:false},{label:`건설 (${won(cost)})`,value:true,primary:true}]);
    build=v;
  }
  if(build){
    spendMoney(p,cost,`${n.name} ${nextLbl}`);n.level++;
    log(`${pname(p)} ${n.name} ${nextLbl} 건설 · -${won(cost)}`);
    updateBoard();
  }
}
async function payToll(p,n){
  const owner=state.players[n.owner];
  const toll=tollOf(n);
  const tags=[];
  if(hasMonopoly(n.owner,n.group))tags.push("독점2배");
  if(n.festival)tags.push("축제2배");
  if(n.level===4)tags.push(n.type==="port"?"항구랜드마크":"랜드마크");
  log(`${pname(p)} → ${pname(owner)} 통행료 ${won(toll)}${tags.length?" ("+tags.join("·")+")":""}`);
  await charge(p,toll,owner);
}

/* charge: pay `amount` to `to` (player or null=bank). Bankrupt if insufficient. */
async function charge(p,amount,to){
  if(p.money>=amount){
    await moneyEvent(p,-amount, to?`${to.name} 통행료`:"세금·지출");
    if(to) await moneyEvent(to,amount,`${p.name} 통행료 수입`);
    return;
  }
  // insufficient -> bankruptcy (MVP: no mortgaging)
  const remaining=p.money;
  if(to){to.money+=remaining;moneyToast(to,remaining,`${p.name} 통행료 수입`);}
  p.money=0;updateBoard();
  if(!p.isAI){
    await modalChoice("💀 파산",
      `${p.name} 님은 ${won(amount)}를 지불할 수 없어 <span class="big">파산</span>했습니다.<br>보유 도시는 모두 무주공산이 됩니다.`,
      [{label:"확인",value:true,primary:true}]);
  }
  declareBankrupt(p);
}
function declareBankrupt(p){
  p.bankrupt=true;
  ownedCities(p.id).forEach(n=>{n.owner=null;n.level=0;n.festival=false;});
  log(`💀 ${pname(p)} 파산 — 탈락`);
  updateBoard();
}

/* ---------- Special tiles ---------- */
async function doWorldTour(p){
  log(`${pname(p)} 🧭 세계여행 — 원하는 도시로 이동`);
  const dests=BOARD.filter(n=>isCity(n)).map(n=>({
    label:`${n.name}${n.type==="port"?" ⚓":""}<br><small style="color:var(--ink-soft)">${n.owner==null?"미소유":(n.owner===p.id?"내 도시":state.players[n.owner].name)}</small>`,
    value:n.id
  }));
  let destId;
  if(p.isAI){
    // AI: prefer an unowned affordable city, else a own-group city, else start
    const un=BOARD.filter(n=>isCity(n)&&n.owner==null&&n.price<=p.money).sort((a,b)=>b.price-a.price);
    const mine=ownedCities(p.id).filter(n=>n.level<4).sort((a,b)=>b.price-a.price);
    destId=(un[0]||mine[0]||NODE(0)).id;
  }else{
    destId=await modalPick("🧭 세계여행","이동할 도시를 선택하세요.",dests);
  }
  p.nodeId=destId;updateBoard();await delay(300);
  await resolveLanding(p);
}
const CHANCE=[
  {t:"무역 성공! 향신료를 팔아 큰 이익을 얻습니다.",m:200000},
  {t:"은행 이자 수령.",m:100000},
  {t:"세금 환급을 받았습니다.",m:150000},
  {t:"폭풍우로 화물 일부를 잃었습니다.",m:-100000},
  {t:"항구 정박료를 냈습니다.",m:-80000},
  {t:"해적을 만나 몸값을 지불했습니다.",m:-150000},
  {t:"세계일주 티켓 당첨! 출발점으로 이동(봉급 수령).",go:0},
  {t:"무인도로 표류했습니다.",island:true},
];
async function doChance(p){
  const c=CHANCE[Math.floor(Math.random()*CHANCE.length)];
  SFX.key();
  log(`${pname(p)} 🗝️ 황금열쇠: ${c.t}`);
  const reason="🗝️ "+c.t;
  if(c.island){
    if(!p.isAI)await modalChoice("🗝️ 황금열쇠",`${c.t}<br><span class="big">무인도로 표류!</span>`,[{label:"확인",value:true,primary:true}]);
    else await delay(400);
    p.nodeId=7;p.inJail=true;p.jailTurns=0;updateBoard();return;
  }
  if(c.go!==undefined){p.nodeId=c.go;updateBoard();await moneyEvent(p,CFG.SALARY,reason);await delay(250);await resolveLanding(p);return;}
  if(c.m>0){await moneyEvent(p,c.m,reason);}
  else if(c.m<0){
    if(p.money>=-c.m)await moneyEvent(p,c.m,reason);
    else await charge(p,-c.m,null);
  }
}
async function doFestival(p){
  const mine=ownedCities(p.id);
  if(mine.length===0){log(`${pname(p)} 🎪 축제 — 보유 도시가 없어 지나갑니다`);return;}
  // clear previous festival owned by this player
  BOARD.forEach(n=>{if(isCity(n)&&n.owner===p.id)n.festival=false;});
  let pick;
  if(p.isAI){pick=mine.slice().sort((a,b)=>tollOf({...b,festival:true})-tollOf({...a,festival:true}))[0].id;}
  else{
    pick=await modalPick("🎪 축제 개최","축제를 열 내 도시를 선택하세요. 통행료가 2배가 됩니다.",
      mine.map(n=>({label:`${n.name}<br><small style="color:var(--ink-soft)">현재 통행료 ${won(tollOf(n))}</small>`,value:n.id})));
  }
  const n=NODE(pick);n.festival=true;
  log(`${pname(p)} 🎪 ${n.name}에서 축제 개최 · 통행료 2배`);
  updateBoard();
}

/* ---------- Turn flow ---------- */
async function rollAndResolve(p){
  let again=true,doubles=0;
  while(again){
    again=false;
    // Jail handling
    if(p.inJail){
      const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
      await animateDice(a,b);
      if(a===b){
        p.inJail=false;log(`${pname(p)} 더블! 무인도 탈출 🎉`);
        await movePlayer(p,a+b);await resolveLanding(p);
      }else{
        p.jailTurns++;
        if(p.jailTurns>=3){
          log(`${pname(p)} 무인도 탈출비 ${won(CFG.ISLAND_FEE)} 지불`);
          await charge(p,CFG.ISLAND_FEE,null);
          if(!p.bankrupt){p.inJail=false;await movePlayer(p,a+b);await resolveLanding(p);}
        }else{log(`${pname(p)} 무인도 정박 중… (${p.jailTurns}/3)`);}
      }
      break;
    }
    const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
    await animateDice(a,b);
    if(a===b){doubles++;log(`${pname(p)} 더블 (${a}·${b})!`);}
    if(doubles===3){
      log(`${pname(p)} 더블 3연속 — 무인도로! 🏝️`);
      p.nodeId=7;p.inJail=true;p.jailTurns=0;updateBoard();break;
    }
    await movePlayer(p,a+b);
    if(!p.bankrupt) await resolveLanding(p);
    checkWin();
    if(state.phase==="over")return;
    if(a===b && !p.bankrupt && !p.inJail){again=true;await delay(450);}
  }
}
async function animateDice(a,b){
  const d1=document.getElementById("d1"),d2=document.getElementById("d2");
  SFX.dice();
  d1.classList.remove("pop");d2.classList.remove("pop");
  d1.classList.add("roll");d2.classList.add("roll");
  for(let i=0;i<14;i++){showDice(1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6));await delay(62);}
  d1.classList.remove("roll");d2.classList.remove("roll");
  showDice(a,b);
  void d1.offsetWidth;d1.classList.add("pop");d2.classList.add("pop");   // settle pop
  await delay(280);
}

let busy=false;
async function humanTurn(){
  const btn=document.getElementById("rollBtn");
  btn.disabled=false;btn.textContent="🎲 주사위 굴리기";
  document.getElementById("turnLine").innerHTML=`${pname(currentPlayer())} 님의 차례`;
}
function onRollClick(){
  const p=currentPlayer();
  if(busy||p.isAI||p.bankrupt||state.phase==="over")return;
  busy=true;document.getElementById("rollBtn").disabled=true;
  rollAndResolve(p).then(()=>{busy=false;endTurn();});
}
async function aiTurn(){
  const p=currentPlayer();
  document.getElementById("turnLine").innerHTML=`${pname(p)} <span style="color:var(--ink-soft)">(AI) 진행 중…</span>`;
  document.getElementById("rollBtn").disabled=true;
  busy=true;await delay(650);
  await rollAndResolve(p);
  busy=false;endTurn();
}
function aliveCount(){return state.players.filter(p=>!p.bankrupt).length;}
function checkWin(){
  if(state.phase==="over")return;
  if(aliveCount()<=1){
    state.phase="over";
    const w=state.players.find(p=>!p.bankrupt);
    setTimeout(()=>showWin(w),400);
  }
}
async function showWin(w){
  document.getElementById("rollBtn").disabled=true;
  await modalChoice("🏆 항해 종료",
    `<div class="win-emoji">🏆</div>
     <div style="text-align:center;font-size:17px;font-weight:800;margin:6px 0">${w?w.name+" 승리!":"무승부"}</div>
     <div style="text-align:center;color:var(--ink-soft)">최종 자산 ${w?won(netWorth(w)):"-"}</div>`,
    [{label:"새 게임",value:true,primary:true}]);
  location.reload();
}
function endTurn(){
  if(state.phase==="over")return;
  do{ state.cur=(state.cur+1)%state.players.length; }while(state.players[state.cur].bankrupt);
  renderPlayers();
  nextStep();
}
function nextStep(){
  if(state.phase==="over")return;
  const p=currentPlayer();
  updateBoard();
  if(p.isAI){aiTurn();}
  else{humanTurn();}
}

/* ---------- Fit board to viewport height (transform scale, DPR-safe) ---------- */
function fitBoard(){
  const wrap=document.querySelector('.board-wrap');
  const board=document.getElementById('board');
  if(!wrap||!board||!state.started)return;
  const BORDER=6;
  board.style.transform='none';
  wrap.style.width='';wrap.style.height='';
  const BW=board.offsetWidth, BH=board.offsetHeight;   // intrinsic board size
  const top=wrap.getBoundingClientRect().top;
  const availH=window.innerHeight-top-16;
  const narrow=window.innerWidth<860;
  const availW=narrow?(window.innerWidth-20):(window.innerWidth-330); // reserve side panel on desktop
  let z=Math.min(availH/(BH+2*BORDER), availW/(BW+2*BORDER));
  z=Math.max(0.4,Math.min(z,2.4));
  board.style.transformOrigin='top left';
  board.style.transform='scale('+z+')';
  wrap.style.width=(BW*z+2*BORDER)+'px';
  wrap.style.height=(BH*z+2*BORDER)+'px';
}

/* ---------- Start game ---------- */
function startGame(){
  state.players=[];
  for(let i=0;i<setupCount;i++){
    const s=setupSlots[i];
    state.players.push({id:i,name:s.name.trim()||("항해사"+(i+1)),isAI:s.ai,
      money:CFG.START_MONEY,nodeId:0,inJail:false,jailTurns:0,bankrupt:false,docked:null});
  }
  // reset board ownership
  BOARD.forEach(n=>{if(isCity(n)){n.owner=null;n.level=0;n.festival=false;}});
  state.cur=0;state.phase="play";state.started=true;
  document.getElementById("setup").style.display="none";
  document.getElementById("game").classList.add("live");
  buildBoardDOM();updateBoard();fitBoard();
  document.getElementById("log").innerHTML="";
  log("⚓ 대항해 출발! 각 항해사 자금 "+won(CFG.START_MONEY));
  nextStep();
}

/* ---------- Init ---------- */
document.getElementById("startBtn").onclick=()=>{SFX.ensure();startGame();};
document.getElementById("rollBtn").onclick=onRollClick;
document.getElementById("muteBtn").onclick=function(){
  SFX.on=!SFX.on; this.textContent=SFX.on?"🔊":"🔇"; this.classList.toggle("off",!SFX.on);
  if(SFX.on){SFX.ensure();SFX.key();}
};
window.addEventListener("resize",fitBoard);
window.addEventListener("orientationchange",fitBoard);
renderSetup();
</script>
